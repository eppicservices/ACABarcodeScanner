# Docker Compose for Local Development
# Only runs PostgreSQL - you run Next.js locally with npm run dev
#
# Usage:
#   1. Copy .env.development.example to .env.local
#   2. Start database: docker compose -f docker-compose.dev.yml up -d
#   3. Run migrations: npx prisma migrate dev
#   4. Start app: npm run dev
#   5. Access app at: http://localhost:3000
#
# Optional pgAdmin:
#   docker compose -f docker-compose.dev.yml --profile admin up -d

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lunch_scanner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lunch_scanner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # pgAdmin (Optional - use --profile admin)
  # ===========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localhost.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - admin

volumes:
  postgres_dev_data:
  pgadmin_data:

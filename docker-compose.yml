# Docker Compose for Supabase Cloud Deployment
# Uses Supabase Cloud for database and authentication
# Lightweight: only runs the Next.js application
#
# Usage:
#   1. Set up a Supabase Cloud project at https://supabase.com
#   2. Copy .env.example to .env and add your Supabase credentials
#   3. Run: docker compose up -d
#
# For self-hosted deployment without Supabase, use:
#   docker compose -f docker-compose.prisma.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      # Provider configuration (Supabase)
      - DATABASE_PROVIDER=supabase
      - AUTH_PROVIDER=supabase
      - NEXT_PUBLIC_AUTH_PROVIDER=supabase
      # Supabase credentials
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Application
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - CRON_SECRET=${CRON_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Caddy reverse proxy with automatic HTTPS
  # Uncomment this section if you want automatic SSL certificates

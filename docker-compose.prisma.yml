# Docker Compose for Self-Hosted Deployment
# Uses PostgreSQL + Prisma + NextAuth (lightweight, ~1GB RAM)
#
# Usage:
#   1. Copy .env.docker.example to .env
#   2. Edit .env with your settings
#   3. Run: docker compose -f docker-compose.prisma.yml up -d
#   4. Run migrations: docker compose -f docker-compose.prisma.yml exec app npx prisma migrate deploy
#   5. Create admin at: https://your-domain.com/admin/signup

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-lunch_scanner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lunch_scanner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      # Provider configuration
      - DATABASE_PROVIDER=prisma
      - AUTH_PROVIDER=nextauth
      - NEXT_PUBLIC_AUTH_PROVIDER=nextauth
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lunch_scanner}
      # NextAuth
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      # Application
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - CRON_SECRET=${CRON_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Caddy reverse proxy with automatic HTTPS
  # Uncomment and configure your domain in Caddyfile
  # caddy:
  #   image: caddy:2-alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - app
  #   restart: unless-stopped

volumes:
  postgres_data:
